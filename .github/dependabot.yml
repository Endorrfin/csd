# === ADDED: controlled dependency updates ===
#
# Why: this repo uses caret ranges, so `rm -rf package-lock.json && npm install`
# silently moves every dependency at once. That is how prettier 3.8 -> 3.9,
# typescript-eslint 8.57 -> 8.65 and sanitize-html 2.17.5 -> 2.17.6 (ESM-only
# htmlparser2) all landed in one unreviewable step.
#
# Dependabot inverts that: updates arrive as individual PRs, each one gated by
# .github/workflows/test.yml (lint + check:cjs + unit + e2e). Nothing reaches
# main without CI having proven it loads and passes.
#
# Grouping rule below: minor/patch updates are batched per area to keep PR
# volume sane.
#
# MAJOR updates are no longer proposed automatically. The original
# "one ungrouped PR per major" idea produced 16 simultaneous major PRs on the
# first run (typescript 5.9 -> 7.0, typeorm 0.3 -> 1.1, Angular 21 -> 22 split
# across five unmergeable PRs, eslint 9 -> 10, @types/node 22 -> 26, ...).
# That is not a review queue, it is noise — and noise is what let the
# sanitize-html regression through in the first place. Majors are now opt-in:
# bump them by hand, one framework at a time, on a dedicated branch.

version: 2

updates:
  # ── Backend: NestJS 11 + TypeORM + Lambda ────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(backend)
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@codegenie/serverless-express'
        update-types:
          - minor
          - patch
      backend-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'typescript'
          - 'jest'
          - '@types/jest'
          - 'ts-jest'
          - 'ts-node'
          - 'ts-loader'
          - 'supertest'
          - '@types/*'
        update-types:
          - minor
          - patch
      backend-runtime:
        patterns:
          - '*'
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - '@types/*'
        update-types:
          - patch
    # === ADDED: sanitize-html is pinned to an exact 2.17.5 on purpose. ===
    # 2.17.6 bumped htmlparser2 ^10 -> ^12 (ESM-only). AWS's managed nodejs22.x
    # runtime has no require(esm), so the Lambda dies at cold start with
    # ERR_REQUIRE_ESM -> 502 on every route. Unpin only together with a bundler
    # (esbuild) or an `await import()` refactor of SanitizeHtmlPipe.
    ignore:
      # no automatic major bumps — see header comment.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # sanitize-html is pinned to an exact 2.17.5 on purpose: 2.17.6 bumped
      # htmlparser2 ^10 -> ^12 (ESM-only) and killed the Lambda cold start with
      # ERR_REQUIRE_ESM -> 502 on every route. Blocked at ALL levels, not just
      # major, because that break shipped in a PATCH release.
      # Unpin only together with a bundler (esbuild) or an `await import()`
      # refactor of SanitizeHtmlPipe — and re-run `npm run check:cjs`.
      - dependency-name: sanitize-html

  # ── Frontend: Angular 21 standalone + SSR ────────────────────────────────
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(ui)
    groups:
      # Angular packages must move together — a split @angular/core vs
      # @angular/cli bump does not build.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'zone.js'
          - 'rxjs'
        update-types:
          - minor
          - patch
      ui-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - '@types/*'
        update-types:
          - minor
          - patch
      ui-runtime:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@types/*'
        update-types:
          - patch
    # no automatic major bumps — see header comment.
    # Angular majors in particular must move as one hand-made branch
    # (core + common + cli + ssr + devkit + angular-eslint together).
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # ── GitHub Actions: deploy.yml / test.yml pin exact action versions ──────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - '*'
        # majors included here, unlike the npm ecosystems above.
        # An action major (actions/checkout v4 -> v7) cannot brick the Lambda —
        # worst case CI goes red, which is a safe failure mode. Grouping them
        # keeps it to ONE reviewable PR instead of one per action.
        update-types:
          - major
          - minor
          - patch
