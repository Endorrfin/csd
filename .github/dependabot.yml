# === ADDED: controlled dependency updates ===
#
# Why: this repo uses caret ranges, so `rm -rf package-lock.json && npm install`
# silently moves every dependency at once. That is how prettier 3.8 -> 3.9,
# typescript-eslint 8.57 -> 8.65 and sanitize-html 2.17.5 -> 2.17.6 (ESM-only
# htmlparser2) all landed in one unreviewable step.
#
# Dependabot inverts that: updates arrive as individual PRs, each one gated by
# .github/workflows/test.yml (lint + check:cjs + unit + e2e). Nothing reaches
# main without CI having proven it loads and passes.
#
# Grouping rule below: minor/patch updates are batched per area to keep PR
# volume sane; MAJOR updates are deliberately left ungrouped so each one gets
# its own PR and its own review.

version: 2

updates:
  # ── Backend: NestJS 11 + TypeORM + Lambda ────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(backend)
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@codegenie/serverless-express'
        update-types:
          - minor
          - patch
      backend-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'typescript'
          - 'jest'
          - '@types/jest'
          - 'ts-jest'
          - 'ts-node'
          - 'ts-loader'
          - 'supertest'
          - '@types/*'
        update-types:
          - minor
          - patch
      backend-runtime:
        patterns:
          - '*'
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - '@types/*'
        update-types:
          - patch

  # ── Frontend: Angular 21 standalone + SSR ────────────────────────────────
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(ui)
    groups:
      # Angular packages must move together — a split @angular/core vs
      # @angular/cli bump does not build.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'zone.js'
          - 'rxjs'
        update-types:
          - minor
          - patch
      ui-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - '@types/*'
        update-types:
          - minor
          - patch
      ui-runtime:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@types/*'
        update-types:
          - patch

  # ── GitHub Actions: deploy.yml / test.yml pin exact action versions ──────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
