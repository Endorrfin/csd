# .github/workflows/deploy.yml
name: Deploy to AWS

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  # allow manual trigger using main branch
  workflow_dispatch:

# one static concurrency group for every prod deploy
# The group MUST NOT interpolate github.event_name. It used to, which put PR-merge runs in
# `deploy-prod-pull_request` and manual runs in `deploy-prod-workflow_dispatch` — different
# groups, blind to each other, so two deploys could run at once against one RDS instance and
# one CloudFormation stack.
#
# cancel-in-progress is false ON PURPOSE. A prod deploy must never be aborted mid-flight:
#   - `migration:run` uses migrationsTransactionMode: 'each' (backend/src/database/data-source.ts),
#     so an interrupted run leaves the schema on a partially applied set with nothing to roll back;
#   - killing `serverless deploy` kills only the CLI — CloudFormation keeps going server-side and
#     the stack is left in UPDATE_IN_PROGRESS, which blocks the very next deploy;
#   - an interrupted `s3 sync --delete` serves 404s for hashed chunks until the next run lands.
#
# Queueing still gives the "deploy now" behaviour the old comment claimed: GitHub cancels any
# previously PENDING run in a group, so a manual dispatch supersedes a stale queued PR-merge run.
# It just waits for the in-flight one instead of aborting it. To stop one specific run, cancel it
# from the Actions tab, where the step it is currently on is visible.
concurrency:
  group: deploy-prod
  cancel-in-progress: false
# ====================================================================

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # === ADDED: single source of truth for Node version (matches local 22.17.0) ===
  NODE_VERSION: '22.17.0'
  # ============================================================================

jobs:
  deploy-backend:
    name: Deploy Backend (NestJS → Lambda)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # === MODIFIED: pinned via env variable ===
          node-version: ${{ env.NODE_VERSION }}
          # =========================================
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # cold-start guard, BEFORE migrations and before deploy.
      # `nest build` emits CommonJS and Lambda loads it with require(). AWS's
      # managed nodejs22.x runtime has NO require(esm) support, so a single
      # ESM-only transitive dep bricks every route with ERR_REQUIRE_ESM at init
      # (this is exactly what sanitize-html 2.17.6 -> htmlparser2 v12 did).
      # The script runs node with --no-experimental-require-module to reproduce
      # that runtime; plain Node 22.12+ would hide the bug.
      # Placed before the migration steps on purpose: never mutate prod RDS for
      # a build we already know cannot boot.
      - name: CommonJS load check (Lambda cold-start guard)
        run: npm run check:cjs

      - name: Show migration status (before)
        id: migrations-before
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "📋 Migration status BEFORE deploy:"
          npm run migration:show 2>&1 | tee /tmp/migrations-before.txt
          PENDING=$(grep -c '\[ \]' /tmp/migrations-before.txt 2>/dev/null || true)
          PENDING="${PENDING:-0}"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: $PENDING"

      - name: Run DB migrations
        id: migrations-run
        if: steps.migrations-before.outputs.pending != '0'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "🔄 Running ${{ steps.migrations-before.outputs.pending }} pending migration(s)..."
          npm run migration:run 2>&1 | tee /tmp/migrations-run.txt

      - name: Show migration status (after) and write summary
        if: always() && steps.migrations-before.outcome == 'success'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          if [ "${{ steps.migrations-run.outcome }}" = "skipped" ]; then
            echo "ℹ️  Migration step was skipped (no pending migrations)" \
              | tee /tmp/migrations-after.txt
          else
            echo "📋 Migration status AFTER deploy:"
            npm run migration:show 2>&1 | tee /tmp/migrations-after.txt
          fi

          {
            echo "## 🗄️ Database Migrations"
            echo ""
            echo "**Pending before deploy:** ${{ steps.migrations-before.outputs.pending }}"
            echo ""
            echo "<details><summary>Migration status (before)</summary>"
            echo ""
            echo '```'
            cat /tmp/migrations-before.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Migration status (after)</summary>"
            echo ""
            echo '```'
            cat /tmp/migrations-after.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "### 🔙 Rollback (if needed)"
            echo ""
            echo "Run locally with prod credentials:"
            echo '```bash'
            echo "cd backend"
            echo "npm run migration:revert  # reverts the LAST migration only"
            echo '```'
            echo ""
            echo "Repeat \`migration:revert\` for each migration to undo."
            echo "Verify with \`npm run migration:show\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          # pass Turnstile secret into serverless deploy → Lambda env
          # (guard is fail-closed in prod; empty secret = 403 on recovery upload+submit)
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: npx serverless deploy --stage prod

      - name: Smoke test backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Attempt $i: GET ${BACKEND_URL}/api/health"
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "${BACKEND_URL}/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend healthy:"
              cat /tmp/health.json
              exit 0
            fi
            echo "⚠️  Got HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend smoke test failed after 5 attempts"
          exit 1

      # === ADDED: success summary with AWS Console links ===
      - name: Backend deploy summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Backend deployed"
            echo ""
            echo "| Resource | Link |"
            echo "| --- | --- |"
            echo "| 🚀 Lambda function | [csd-api-prod-api](https://eu-central-1.console.aws.amazon.com/lambda/home?region=eu-central-1#/functions/csd-api-prod-api) |"
            echo "| 📊 CloudWatch logs | [/aws/lambda/csd-api-prod-api](https://eu-central-1.console.aws.amazon.com/cloudwatch/home?region=eu-central-1#logsV2:log-groups/log-group/\$252Faws\$252Flambda\$252Fcsd-api-prod-api) |"
            echo "| 🌐 API Gateway | [csd-api endpoints](https://eu-central-1.console.aws.amazon.com/apigateway/main/apis?region=eu-central-1) |"
            echo "| 🗃️ RDS database | [csd-postgres](https://eu-central-1.console.aws.amazon.com/rds/home?region=eu-central-1#database:id=csd-postgres) |"
            echo ""
            echo "### Quick CLI checks"
            echo '```bash'
            echo "# Lambda env vars"
            echo "aws lambda get-function-configuration --function-name csd-api-prod-api --region eu-central-1 --query 'Environment.Variables'"
            echo ""
            echo "# Tail logs (live)"
            echo "aws logs tail /aws/lambda/csd-api-prod-api --since 5m --region eu-central-1 --follow"
            echo ""
            echo "# Health probe"
            echo "curl -i https://www.csd-fund.org/api/health"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # =====================================================

      # === ADDED: failure summary with diagnostic commands ===
      - name: Backend deploy summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Backend deploy FAILED"
            echo ""
            echo "Check the failed step above for the exact error. Common causes:"
            echo ""
            echo "- **Migration failed** → DB schema may be in inconsistent state. Run \`npm run migration:show\` locally to inspect."
            echo "- **Serverless deploy failed** → CloudFormation may be in \`UPDATE_ROLLBACK_FAILED\`. Check the CloudFormation console."
            echo "- **Smoke test failed** → Lambda may have started but \`/api/health\` returns non-200. Check CloudWatch logs."
            echo ""
            echo "### Diagnostic commands"
            echo '```bash'
            echo "# Tail logs from the past 10 minutes"
            echo "aws logs tail /aws/lambda/csd-api-prod-api --since 10m --region eu-central-1"
            echo ""
            echo "# Check Lambda current config"
            echo "aws lambda get-function-configuration --function-name csd-api-prod-api --region eu-central-1"
            echo ""
            echo "# Check CloudFormation stack status"
            echo "aws cloudformation describe-stacks --stack-name csd-api-prod --region eu-central-1 --query 'Stacks[0].StackStatus'"
            echo '```'
            echo ""
            echo "### Useful links"
            echo "- [CloudWatch logs](https://eu-central-1.console.aws.amazon.com/cloudwatch/home?region=eu-central-1#logsV2:log-groups/log-group/\$252Faws\$252Flambda\$252Fcsd-api-prod-api)"
            echo "- [Lambda function](https://eu-central-1.console.aws.amazon.com/lambda/home?region=eu-central-1#/functions/csd-api-prod-api)"
            echo "- [CloudFormation stack](https://eu-central-1.console.aws.amazon.com/cloudformation/home?region=eu-central-1#/stacks?filteringText=csd-api-prod)"
          } >> "$GITHUB_STEP_SUMMARY"
      # =======================================================

  deploy-frontend:
    name: Deploy Frontend (Angular SSR → Lambda + S3)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # === MODIFIED: pinned via env variable ===
          node-version: ${{ env.NODE_VERSION }}
          # =========================================
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Sync static assets to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          # Hashed assets — довгий кеш
          aws s3 sync dist/ui/browser/ s3://csd-fund-static/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML — без кешу
          aws s3 sync dist/ui/browser/ s3://csd-fund-static/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Deploy SSR Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx serverless deploy --stage prod

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3U465AMSVR9PN \
            --paths "/*"

      - name: Smoke test frontend
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -euo pipefail
          # FRONTEND_URL is now a comma-separated CORS allowlist (audit P0-1);
          # smoke-test the canonical (first) origin only.
          SMOKE_URL="${FRONTEND_URL%%,*}"
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: GET ${SMOKE_URL}/"
            HTTP_CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "${SMOKE_URL}/" || echo "000")
            # literal "<app-root>" only matched the CSR shell — the SSR-rendered
            # tag carries attributes (<app-root ng-server-context="ssr" ...>), so the old
            # check fails exactly when SSR starts working (audit P0-3). Now we require the
            # server-render marker itself (matches both "ssr" and future "ssg").
            if [ "$HTTP_CODE" = "200" ] && grep -q 'ng-server-context' /tmp/index.html; then
              echo "✅ Frontend healthy: HTTP 200 + server-rendered content (ng-server-context)"
              exit 0
            fi
            echo "⚠️  HTTP $HTTP_CODE, SSR marker present: $(grep -c 'ng-server-context' /tmp/index.html || echo 0). Retrying in 15s..."
            sleep 15
          done
          echo "❌ Frontend smoke test failed after 6 attempts"
          echo "--- Last response head: ---"
          head -30 /tmp/index.html || true
          exit 1

      # === ADDED: success summary with AWS Console links ===
      - name: Frontend deploy summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Frontend deployed"
            echo ""
            echo "🌐 **Live site:** https://www.csd-fund.org"
            echo ""
            echo "| Resource | Link |"
            echo "| --- | --- |"
            echo "| 🚀 SSR Lambda | [csd-ssr-prod-ssr](https://eu-central-1.console.aws.amazon.com/lambda/home?region=eu-central-1#/functions/csd-ssr-prod-ssr) |"
            echo "| 📊 SSR CloudWatch logs | [/aws/lambda/csd-ssr-prod-ssr](https://eu-central-1.console.aws.amazon.com/cloudwatch/home?region=eu-central-1#logsV2:log-groups/log-group/\$252Faws\$252Flambda\$252Fcsd-ssr-prod-ssr) |"
            echo "| 🪣 S3 static assets | [csd-fund-static](https://eu-central-1.console.aws.amazon.com/s3/buckets/csd-fund-static) |"
            echo "| 🌍 CloudFront distribution | [E3U465AMSVR9PN](https://us-east-1.console.aws.amazon.com/cloudfront/v4/home#/distributions/E3U465AMSVR9PN) |"
            echo ""
            echo "### Cache info"
            echo "- CloudFront invalidation triggered for \`/*\`"
            echo "- Full propagation: 30–90 seconds"
            echo ""
            echo "### Quick CLI checks"
            echo '```bash'
            echo "# Verify homepage"
            echo "curl -I https://www.csd-fund.org/"
            echo ""
            echo "# Tail SSR logs"
            echo "aws logs tail /aws/lambda/csd-ssr-prod-ssr --since 5m --region eu-central-1 --follow"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # =====================================================

      # === ADDED: failure summary with diagnostic commands ===
      - name: Frontend deploy summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Frontend deploy FAILED"
            echo ""
            echo "Check the failed step above for the exact error. Common causes:"
            echo ""
            echo "- **\`ng build\` failed** → TypeScript/template errors. Run \`npx ng build --configuration production\` locally to reproduce."
            echo "- **S3 sync failed** → IAM permissions or bucket policy. Verify \`s3:PutObject\` and \`s3:DeleteObject\` on \`csd-fund-static\`."
            echo "- **Serverless deploy failed** → CloudFormation \`csd-ssr-prod\` may be stuck. Check stack status."
            echo "- **CloudFront invalidation failed** → IAM \`cloudfront:CreateInvalidation\` permission missing."
            echo "- **Smoke test failed** → SSR Lambda may have rendered an error page (still 200 but no \`<app-root>\`). Check SSR logs."
            echo ""
            echo "### Diagnostic commands"
            echo '```bash'
            echo "# Verify what's currently served"
            echo "curl -s https://www.csd-fund.org/ | head -30"
            echo ""
            echo "# Tail SSR logs"
            echo "aws logs tail /aws/lambda/csd-ssr-prod-ssr --since 10m --region eu-central-1"
            echo ""
            echo "# CloudFormation stack status"
            echo "aws cloudformation describe-stacks --stack-name csd-ssr-prod --region eu-central-1 --query 'Stacks[0].StackStatus'"
            echo '```'
            echo ""
            echo "### Useful links"
            echo "- [SSR CloudWatch logs](https://eu-central-1.console.aws.amazon.com/cloudwatch/home?region=eu-central-1#logsV2:log-groups/log-group/\$252Faws\$252Flambda\$252Fcsd-ssr-prod-ssr)"
            echo "- [CloudFront distribution](https://us-east-1.console.aws.amazon.com/cloudfront/v4/home#/distributions/E3U465AMSVR9PN)"
            echo "- [S3 bucket](https://eu-central-1.console.aws.amazon.com/s3/buckets/csd-fund-static)"
          } >> "$GITHUB_STEP_SUMMARY"
      # =======================================================
