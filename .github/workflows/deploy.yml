# .github/workflows/deploy.yml
name: Deploy to AWS

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  # allow manual trigger using main branch
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-backend:
    name: Deploy Backend (NestJS → Lambda)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # === snapshot migration state BEFORE running ===
      - name: Show migration status (before)
        id: migrations-before
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "📋 Migration status BEFORE deploy:"
          npm run migration:show 2>&1 | tee /tmp/migrations-before.txt
          PENDING=$(grep -c '\[ \]' /tmp/migrations-before.txt 2>/dev/null || true)
          PENDING="${PENDING:-0}"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: $PENDING"
      # =======================================================

      # === scan migrations for dangerous SQL patterns ===
      # Non-blocking — surfaces warnings in job summary, doesn't fail the deploy
      - name: Scan migrations for destructive operations
        id: dangerous-check
        run: |
          set -euo pipefail
          DANGEROUS=$(grep -rEn 'DROP TABLE|DROP COLUMN|ALTER COLUMN.*NOT NULL|TRUNCATE' \
            src/database/migrations/ 2>/dev/null || echo "")
          if [ -n "$DANGEROUS" ]; then
            echo "⚠️  Destructive operations found in migrations:"
            echo "$DANGEROUS"
            {
              echo "found=true"
              echo "details<<DANGEROUS_EOF"
              echo "$DANGEROUS"
              echo "DANGEROUS_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "✅ No obvious destructive operations detected"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # =========================================================

      # === only run when there are pending migrations ===
      - name: Run DB migrations
        id: migrations-run
        if: steps.migrations-before.outputs.pending != '0'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "🔄 Running ${{ steps.migrations-before.outputs.pending }} pending migration(s)..."
          npm run migration:run 2>&1 | tee /tmp/migrations-run.txt
      # ============================================================

      # === snapshot AFTER + write everything to job summary ===
      - name: Show migration status (after) and write summary
        if: always() && steps.migrations-before.outcome == 'success'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          if [ "${{ steps.migrations-run.outcome }}" = "skipped" ]; then
            echo "ℹ️  Migration step was skipped (no pending migrations)" \
              | tee /tmp/migrations-after.txt
          else
            echo "📋 Migration status AFTER deploy:"
            npm run migration:show 2>&1 | tee /tmp/migrations-after.txt
          fi

          {
            echo "## 🗄️ Database Migrations"
            echo ""
            echo "**Pending before deploy:** ${{ steps.migrations-before.outputs.pending }}"
            echo ""
            if [ "${{ steps.dangerous-check.outputs.found }}" = "true" ]; then
              echo "### ⚠️ Destructive Operations Detected"
              echo ""
              echo '```'
              echo "${{ steps.dangerous-check.outputs.details }}"
              echo '```'
              echo ""
            fi
            echo "<details><summary>Migration status (before)</summary>"
            echo ""
            echo '```'
            cat /tmp/migrations-before.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Migration status (after)</summary>"
            echo ""
            echo '```'
            cat /tmp/migrations-after.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "### 🔙 Rollback (if needed)"
            echo ""
            echo "Run locally with prod credentials:"
            echo '```bash'
            echo "cd backend"
            echo "npm run migration:revert  # reverts the LAST migration only"
            echo '```'
            echo ""
            echo "Repeat \`migration:revert\` for each migration to undo."
            echo "Verify with \`npm run migration:show\`."
          } >> "$GITHUB_STEP_SUMMARY"
      # ===============================================================

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: npx serverless deploy --stage prod

      - name: Smoke test backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Attempt $i: GET ${BACKEND_URL}/api/health"
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "${BACKEND_URL}/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend healthy:"
              cat /tmp/health.json
              exit 0
            fi
            echo "⚠️  Got HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend smoke test failed after 5 attempts"
          exit 1

  deploy-frontend:
    name: Deploy Frontend (Angular SSR → Lambda + S3)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Sync static assets to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          # Hashed assets — довгий кеш
          aws s3 sync dist/ui/browser/ s3://csd-fund-static/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML — без кешу
          aws s3 sync dist/ui/browser/ s3://csd-fund-static/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Deploy SSR Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx serverless deploy --stage prod

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3U465AMSVR9PN \
            --paths "/*"

      - name: Smoke test frontend
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: GET ${FRONTEND_URL}/"
            HTTP_CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "${FRONTEND_URL}/" || echo "000")
            if [ "$HTTP_CODE" = "200" ] && grep -q "<app-root>" /tmp/index.html; then
              echo "✅ Frontend healthy: HTTP 200 + <app-root> present"
              exit 0
            fi
            echo "⚠️  HTTP $HTTP_CODE, app-root present: $(grep -c "<app-root>" /tmp/index.html || echo 0). Retrying in 15s..."
            sleep 15
          done
          echo "❌ Frontend smoke test failed after 6 attempts"
          echo "--- Last response head: ---"
          head -30 /tmp/index.html || true
          exit 1
