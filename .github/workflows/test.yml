# .github/workflows/test.yml
# === ADDED: PR-gated quality checks (lint + unit + e2e) ===
#
# Runs on every PR against main, BEFORE merge. Separate from deploy.yml
# (which only runs after merge) so broken PRs never reach prod.
#
# Backend e2e uses Testcontainers; ubuntu-latest already has Docker daemon
# available, no `services:` block needed.

name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.17.0'

jobs:
  backend:
    name: Backend (lint + unit + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CHANGED: lint:check, not lint — `npm run lint` carries --fix, which
      # silently rewrites files in the runner instead of failing the PR.
      - name: Lint
        run: npm run lint:check

      # === ADDED: proves the untransformed CommonJS graph still loads. ===
      # Jest downlevels the ESM-only deps (sanitize-html -> htmlparser2 v12),
      # so it cannot catch an ERR_REQUIRE_ESM cold-start crash on Lambda.
      - name: CommonJS load check
        run: npm run check:cjs

      - name: Unit tests
        run: npm test

      - name: E2E tests (Testcontainers PG 16)
        # Pre-pull image so Testcontainers doesn't time out cold-starting it
        run: |
          docker pull postgres:16-alpine
          npm run test:e2e
