org: csd2019
service: csd-ssr

# === ADDED: per-stage environment blocks (staging, P1-5).
# The `prod` block below is character-for-character what used to be inlined under
# provider.environment, so `serverless package --stage prod` must emit the same
# CloudFormation template as before this change. Only `staging` is new. ===
custom:
  environment:
    prod:
      NODE_ENV: production
      # public hostname for SSR — restores Host behind API Gateway so
      # Angular host validation passes and absolute URLs are correct (audit P0-3)
      PUBLIC_HOST: www.csd-fund.org
    staging:
      NODE_ENV: production
      # Staging hostname = the staging CloudFront domain, injected from the
      # GitHub `staging` environment.
      # The '' default is NOT optional: Serverless v4 resolves the WHOLE config
      # graph regardless of --stage, so a bare ${env:PUBLIC_HOST} here aborts the
      # PROD deploy too. Fail-closed therefore lives in deploy-staging.yml, which
      # refuses to deploy when PUBLIC_HOST is empty — not in this file.
      PUBLIC_HOST: ${env:PUBLIC_HOST, ''}
      # Angular bakes angular.json -> security.allowedHosts into
      # dist/ui/server/angular-app-engine-manifest.mjs at BUILD time, and that
      # baked list holds prod hostnames only. At runtime AngularAppEngine unions
      # the manifest list with NG_ALLOWED_HOSTS (@angular/ssr ssr.mjs,
      # getAllowedHosts), so setting it here is what lets staging pass SSR host
      # validation without a prod rebuild. Omit it and the PUBLIC_HOST middleware
      # in src/server.ts pins Host to a value that is not on the baked list ->
      # 400 / CSR shell, and hydration never happens on staging.
      NG_ALLOWED_HOSTS: ${env:PUBLIC_HOST, ''}
    dev:
      NODE_ENV: production
      PUBLIC_HOST: www.csd-fund.org
# =====================================================================

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29

  # === ADDED: PR 1 / Step 20 — distributed tracing ===
  # Serverless attaches xray:PutTraceSegments / PutTelemetryRecords to the
  # Lambda role on its own; no IAM statement is needed here.
  #
  # Honest scope: this gives the API Gateway segment and the Lambda segment, so
  # cold-start init is visible as its own subsegment and separable from handler
  # time. It does NOT break out the RDS round-trip — that needs
  # `aws-xray-sdk-core` with `capturePostgres`, i.e. a new runtime dependency
  # (another `check:cjs` surface and more cold-start weight). Out of scope for
  # PR 1; ROADMAP.md §6 claims otherwise and is corrected in Step 22.
  tracing:
    apiGateway: true
    lambda: true

  # === ADDED: PR 1 / Step 20 — log retention ===
  # Unset means "never expire". This group holds SSR render errors and the
  # request URLs behind them, including the paths of the needs and complaint
  # forms; keeping that forever is storage nobody audits. Matches the 30 days
  # set on the API stack so the two are queried over the same window.
  #
  # This is a property change, not a new resource: Serverless already declares
  # the log group for every function (`SsrLogGroup` in the packaged template),
  # so there is nothing for CloudFormation to import and no AlreadyExists risk.
  # It applies retroactively to what is already stored.
  logRetentionInDays: 30
  # was an inline block; now picked per stage from custom.environment
  environment: ${self:custom.environment.${sls:stage}}

functions:
  ssr:
    handler: lambda.handler
    events:
      - http:
          method: ANY
          path: /
          cors: false
      - http:
          method: ANY
          path: /{proxy+}
          cors: false

package:
  individually: false
  patterns:
    - 'lambda.mjs'
    - 'dist/ui/server/**'
    - 'node_modules/serverless-http/**'
    - 'node_modules/express/**'
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!.angular/**'
    - '!dist/ui/browser/**'

# === ADDED: PR 1 / Step 21 — CloudWatch alarms → SNS email ===
#
# Same shape as backend/serverless.yml, and deliberately its own topic rather
# than an Export/ImportValue from csd-api: an import would lock the two stacks
# together to save a resource that costs nothing. The price is one extra
# confirmation email, once.
#
# ALARM_EMAIL comes from the CI secret; the '' default keeps a local
# `serverless package` working, because Serverless v4 resolves the whole config
# graph regardless of --stage (see the note at the top of this file).
params:
  default:
    alarmEmail: ${env:ALARM_EMAIL, ''}

resources:
  Conditions:
    IsProd: !Equals ['${sls:stage}', 'prod']
    HasAlarmEmail: !And
      - !Condition IsProd
      - !Not [!Equals ['${param:alarmEmail}', '']]

  Resources:
    AlarmTopic:
      Type: AWS::SNS::Topic
      Condition: IsProd
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-alarms

    AlarmTopicSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        Protocol: email
        Endpoint: ${param:alarmEmail}
        TopicArn: !Ref AlarmTopic

    # An SSR failure is invisible to the API alarms and mostly invisible to
    # users: Angular falls back to the CSR shell, so the page still renders and
    # only SEO and first paint suffer. Nobody reports it. This is the signal.
    SsrErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-ssr-errors
        AlarmDescription: 'SSR Lambda reported >= 1 error in 5 min'
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:provider.stage}-ssr
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    SsrDurationP99Alarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-ssr-duration-p99
        AlarmDescription: 'SSR Lambda p99 duration > 20s (timeout is 29s — early signal)'
        Namespace: AWS/Lambda
        MetricName: Duration
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:provider.stage}-ssr
        ExtendedStatistic: p99
        Period: 300
        EvaluationPeriods: 1
        Threshold: 20000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic
