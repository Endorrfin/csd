    <!-- added integrity + crossorigin -->
    <!--
      SRI on a cross-origin resource requires CORS: without crossorigin the browser
      will not hash the response and blocks the tag outright. Dropping either
      attribute kills /activity-map, and it fails silently — that route is
      RenderMode.Client, so SSR surfaces nothing.
    -->

      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
