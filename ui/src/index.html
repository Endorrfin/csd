<!doctype html>

  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <base href="/" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- added integrity + crossorigin -->
    <!--
      SRI on a cross-origin resource requires CORS: without crossorigin the browser
      will not hash the response and blocks the tag outright. Dropping either
      attribute kills /activity-map, and it fails silently — that route is
      RenderMode.Client, so SSR surfaces nothing.
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV"
      crossorigin=""
    />
    <!-- added integrity + crossorigin -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+"
      crossorigin=""
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CO CF Centre for Support and Development</title>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- added integrity + crossorigin -->
    <script
      src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
      integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr"
      crossorigin=""
    ></script>

    <!-- og:description, og:image; added image dimensions, locale and Twitter tags -->
    <!--
      Site-wide Open Graph defaults. Every route except /blog/:slug ships this
      card; PageTitleService overrides og:title and og:description per route, and
      blog-post.ts additionally overrides og:image and og:url.

      og:description must stay at 100 characters or more — LinkedIn's Post
      Inspector rejects anything shorter with a visible warning, and the previous
      28-character value ("WASH · Відновлення · Укриття") triggered it. The text
      here mirrors HOME.DESCRIPTION in assets/i18n/ua.json; keep the two in step.

      og:image must be the wide card, not an app icon. Pointing this at
      web-app-manifest-512x512.png made every shared link render as the logo
      floating in a white box, because the scrapers pad a square to card ratio.

      the card lives under /assets/, not in public/. CloudFront sends
      only *.js, *.css, /assets/* and six named root files to S3; every other
      root path falls through to the SSR Lambda, whose package excludes
      dist/ui/browser/**. /og-cover.png therefore answered with the HTML 404
      page, and LinkedIn showed its "at least 1600px" warning for it; a
      correctly served 1200x630 card passes without one.
      S3 serves non-HTML files with max-age=31536000, immutable: when the card
      changes, give the file a new name. blog-post.ts falls back to the same
      URL, and the deploy smoke tests fail unless it answers as an image.
    -->
    <meta property="og:site_name" content="CSD Fund" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CSD — Centre for Support and Development" />
    <meta
      property="og:description"
      content="Благодійний фонд «Центр підтримки та розвитку» (CSD Fund). Напрямки діяльності: WASH (водопостачання, санітарія, гігієна), відновлення інфраструктури та укриття."
    />
    <meta property="og:url" content="https://www.csd-fund.org/" />
    <meta property="og:image" content="https://www.csd-fund.org/assets/images/og-cover.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="840" />
    <meta
      property="og:image:alt"
      content="Charitable Organization “Charitable Fund “Centre for Support and Development”” — WASH, recovery and shelter programmes in Ukraine."
    />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.csd-fund.org/assets/images/og-cover.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
