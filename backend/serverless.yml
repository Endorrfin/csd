# backend/serverless.yml
org: csd2019
service: csd-api
useDotenv: true

# media bucket names in one place (env override still wins), reused by both the
# IAM resource ARNs and the AWS_S3_* env vars so they can never drift. Vasyl must
# CREATE each bucket (private one: no public policy, CORS allowing POST from the
# site origin) before uploads go live on that stage.
#
# === ADDED: per-stage defaults (staging, P1-5). Before this, both bucket names
# resolved to the PROD buckets on every stage — a staging deploy would have
# written QA attachments straight into csd-media-private, next to real defect
# acts (PII). The `prod` and `dev` rows keep exactly the values that were here,
# so `serverless package --stage prod` emits an unchanged template. ===
custom:
  mediaBucketByStage:
    prod: csd-media
    staging: csd-media-staging
    dev: csd-media
  privateBucketByStage:
    prod: csd-media-private
    staging: csd-media-private-staging
    dev: csd-media-private
  mediaBucket: ${env:AWS_S3_MEDIA_BUCKET, self:custom.mediaBucketByStage.${sls:stage}}
  privateMediaBucket: ${env:AWS_S3_PRIVATE_BUCKET, self:custom.privateBucketByStage.${sls:stage}}
  # PR 1 / Step 21 — the RDS instance the alarms watch, per stage for the same
  # reason the bucket names are: a staging stack must never alarm on prod.
  rdsInstanceByStage:
    prod: csd-postgres
    staging: csd-postgres-staging
    dev: csd-postgres
  rdsInstance: ${self:custom.rdsInstanceByStage.${sls:stage}}

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29

  # === ADDED: PR 1 / Step 20 — distributed tracing ===
  # Serverless attaches xray:PutTraceSegments / PutTelemetryRecords to the
  # Lambda role on its own; no IAM statement is needed here.
  #
  # Honest scope: this gives the API Gateway segment and the Lambda segment, so
  # cold-start init is visible as its own subsegment and separable from handler
  # time. It does NOT break out the RDS round-trip — that needs
  # `aws-xray-sdk-core` with `capturePostgres`, i.e. a new runtime dependency
  # (another `check:cjs` surface and more cold-start weight). Out of scope for
  # PR 1; ROADMAP.md §6 claims otherwise and is corrected in Step 22.
  tracing:
    apiGateway: true
    lambda: true

  # === ADDED: PR 1 / Step 20 — log retention ===
  # Unset means "never expire", and `auth.service.ts` writes password-reset
  # links into this log group (the only reset channel until PR 3 replaces it
  # with SES). 30 days bounds that exposure and lowers the CloudWatch bill.
  #
  # This is a property change, not a new resource: Serverless already declares
  # the log group for every function (`ApiLogGroup` / `SsrLogGroup` in the
  # packaged template), so there is nothing for CloudFormation to import and no
  # AlreadyExists risk. It applies retroactively to what is already stored.
  logRetentionInDays: 30
  apiGateway:
    binaryMediaTypes:
      - '*/*' # catches all requests regardless of Accept header
      - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      - 'application/octet-stream'

  # IAM permissions for Lambda execution role
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          # was the literal csd-media — now per-stage (custom.mediaBucket)
          Resource: "arn:aws:s3:::${self:custom.mediaBucket}/*"
        # private recovery bucket: upload (POST/PUT) + read
        # (presigned GET for the admin detail view). GetObject also covers HEAD.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: "arn:aws:s3:::${self:custom.privateMediaBucket}/*"

    # ENVIRONMENT
  environment:
    NODE_ENV: production
    DB_HOST: ${env:DB_HOST}
    DB_PORT: '5432'
    DB_USERNAME: ${env:DB_USERNAME}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    JWT_SECRET: ${env:JWT_SECRET}
    # no '' default — an empty value silently enabled CORS '*' in lambda.ts
    # (audit P0-1). Missing env now fails `serverless deploy` in CI, before prod.
    # Format: comma-separated allowlist, canonical origin first.
    FRONTEND_URL: ${env:FRONTEND_URL}
    # was the literal csd-media — now per-stage (custom.mediaBucket)
    AWS_S3_MEDIA_BUCKET: ${self:custom.mediaBucket}
    # private bucket for recovery uploads (PII: defect acts).
    AWS_S3_PRIVATE_BUCKET: ${self:custom.privateMediaBucket}
    # CHANGED: PR-2 — Cloudflare Turnstile secret. '' default keeps deploy green
    # if the GitHub secret isn't set yet; the guard fails closed (403) on the
    # recovery endpoints until it's provisioned — the rest of the API is
    # unaffected (we intentionally do NOT gate app boot on this).
    TURNSTILE_SECRET_KEY: ${env:TURNSTILE_SECRET_KEY, ''}
    # === ADDED: PR-W1 — household applicants on the winterization form are
    # designed but gated off (implementation-plan §7). 'false' default keeps the
    # gate closed even if the GitHub variable is never set; the service answers
    # 422 for applicantType='household' unless this is exactly 'true'.
    WINTERIZATION_HOUSEHOLD_ENABLED: ${env:WINTERIZATION_HOUSEHOLD_ENABLED, 'false'}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          method: ANY
          path: /
          cors:
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Turnstile-Token
      - http:
          method: ANY
          path: /{proxy+}
          cors:
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Turnstile-Token

package:
  patterns:
    - 'dist/**'
    - 'node_modules/**'
    # the AWS RDS CA bundle must reach /var/task, otherwise
    # db-ssl.ts refuses to boot rather than fall back to an unverified TLS
    # connection. Resolved at runtime from $LAMBDA_TASK_ROOT.
    - 'certs/**'
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!test/**'
    - '!.env*'
    - '!coverage/**'

# === ADDED: PR 1 / Step 21 — CloudWatch alarms → SNS email ===
#
# The recipient is deliberately NOT a literal here: it is a personal inbox and
# this file is read by everyone with repo access. CI passes it in from the
# ALARM_EMAIL secret (see .github/workflows/deploy.yml).
#
# The '' default is load-bearing, not laziness. Serverless v4 resolves the WHOLE
# config graph regardless of --stage, so a bare ${env:ALARM_EMAIL} would abort
# every local `serverless package` — the same trap already documented in
# ui/serverless.yml. The HasAlarmEmail condition below is what keeps an empty
# value from reaching CloudFormation, where it would fail resource validation at
# deploy time instead.
#
# Note the failure mode this leaves: with ALARM_EMAIL unset the deploy still
# succeeds and the alarms are still created — only nobody is subscribed, and
# nothing says so. Verify once after the first deploy:
#   aws sns list-subscriptions-by-topic --topic-arn <arn> --query 'Subscriptions[].SubscriptionArn'
# A value of "PendingConfirmation" means the inbox link was never clicked.
params:
  default:
    alarmEmail: ${env:ALARM_EMAIL, ''}

resources:
  Conditions:
    # Alarms are prod-only on purpose. csd-postgres-staging is stopped on a
    # schedule for most of the day (CONCERNS.md §2), so on staging every alarm
    # would sit in INSUFFICIENT_DATA and email on each scheduled start and stop.
    IsProd: !Equals ['${sls:stage}', 'prod']
    HasAlarmEmail: !And
      - !Condition IsProd
      - !Not [!Equals ['${param:alarmEmail}', '']]

  Resources:
    # One topic per stack rather than one shared through Export/ImportValue: an
    # import would lock csd-api and csd-ssr together (the export cannot be
    # renamed or removed while the other stack references it, and stack deletion
    # order becomes constrained) to save a resource that costs nothing.
    AlarmTopic:
      Type: AWS::SNS::Topic
      Condition: IsProd
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-alarms

    # SNS email subscriptions are created as PENDING_CONFIRMATION and require a
    # click in the inbox. That step is inherent to SNS email, not a shortcut —
    # until it is confirmed, no alarm mail is delivered.
    AlarmTopicSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        Protocol: email
        Endpoint: ${param:alarmEmail}
        TopicArn: !Ref AlarmTopic

    # ── API Lambda ─────────────────────────────────────────────────────────
    ApiErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-api-errors
        AlarmDescription: 'API Lambda reported >= 1 error in 5 min'
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:provider.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        # Zero traffic is not an incident. This portal is quiet at night.
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    ApiDurationP99Alarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-api-duration-p99
        AlarmDescription: 'API Lambda p99 duration > 20s (timeout is 29s — early signal)'
        Namespace: AWS/Lambda
        MetricName: Duration
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:provider.stage}-api
        ExtendedStatistic: p99
        Period: 300
        EvaluationPeriods: 1
        Threshold: 20000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    ApiThrottlesAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-api-throttles
        AlarmDescription: 'API Lambda was throttled (>= 1 in 5 min)'
        Namespace: AWS/Lambda
        MetricName: Throttles
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:provider.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    # Not redundant with ApiErrorsAlarm. A Lambda that returns a malformed
    # response, or fails during init, surfaces as an API Gateway 502/504 and can
    # miss the Lambda Errors metric entirely — which is exactly the shape of
    # Incidents #2 and #4 (ESM cold-start, 502 on every route).
    # ApiName is `${stage}-${service}`, the name Serverless gives the REST API.
    # ApiName+Stage metrics are published by default; the per-method breakdown
    # would need detailed metrics enabled, and is not needed here.
    ApiGateway5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-apigw-5xx
        AlarmDescription: 'API Gateway returned >= 1 5xx in 5 min'
        Namespace: AWS/ApiGateway
        MetricName: 5XXError
        Dimensions:
          - Name: ApiName
            Value: ${self:provider.stage}-${self:service}
          - Name: Stage
            Value: ${self:provider.stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    # ── RDS ────────────────────────────────────────────────────────────────
    # The instance is not managed by this stack; the dimension is just its
    # identifier, taken per stage so that enabling alarms on staging later
    # cannot point them at the production database — the same reason
    # custom.mediaBucketByStage exists.
    RdsCpuAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-rds-cpu
        AlarmDescription: 'RDS CPU > 80% for 10 min'
        Namespace: AWS/RDS
        MetricName: CPUUtilization
        Dimensions:
          - Name: DBInstanceIdentifier
            Value: ${self:custom.rdsInstance}
        Statistic: Average
        Period: 300
        EvaluationPeriods: 2
        Threshold: 80
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    # Connection exhaustion is a real failure mode here, not a theoretical one.
    # No pool size is configured, so node-postgres keeps its default of 10 per
    # container; roughly 8 warm Lambdas reach this threshold and ~11 saturate a
    # db.t4g.micro (max_connections ≈ 112 at 1 GB). Confirm the class before
    # trusting the number: aws rds describe-db-instances --db-instance-identifier
    # csd-postgres --query 'DBInstances[0].DBInstanceClass'
    RdsConnectionsAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-rds-connections
        AlarmDescription: 'RDS connections > 80 (~70% of a t4g.micro cap; each warm Lambda holds up to 10)'
        Namespace: AWS/RDS
        MetricName: DatabaseConnections
        Dimensions:
          - Name: DBInstanceIdentifier
            Value: ${self:custom.rdsInstance}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 80
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

    RdsFreeableMemoryAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-rds-freeable-memory
        AlarmDescription: 'RDS FreeableMemory < 100MB (~10% of 1GB)'
        Namespace: AWS/RDS
        MetricName: FreeableMemory
        Dimensions:
          - Name: DBInstanceIdentifier
            Value: ${self:custom.rdsInstance}
        Statistic: Average
        Period: 300
        EvaluationPeriods: 1
        Threshold: 104857600
        ComparisonOperator: LessThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic
